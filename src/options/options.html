<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser Voice Copilot Settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings">
      <header>
        <h1>Voice Copilot Settings</h1>
        <p>Privacy-first controls for speech activation, overlays, and safety confirmation.</p>
      </header>

      <form id="settings-form">
        <label>
          <span>Wake phrase</span>
          <input id="wakeWord" name="wakeWord" maxlength="40" autocomplete="off">
        </label>

        <label>
          <span>Language</span>
          <input id="language" name="language" maxlength="20" autocomplete="off" placeholder="en-US">
        </label>

        <label class="switch">
          <input id="overlayEnabled" name="overlayEnabled" type="checkbox">
          <span>Show floating overlay</span>
        </label>

        <label class="switch">
          <input id="autoConfirm" name="autoConfirm" type="checkbox">
          <span>Auto-confirm risky commands</span>
        </label>

        <label>
          <span>Scroll speed</span>
          <input id="scrollSpeed" name="scrollSpeed" type="range" min="100" max="2000" step="50">
          <output id="scrollSpeedValue"></output>
        </label>

        <label>
          <span>Voice sensitivity</span>
          <input id="voiceSensitivity" name="voiceSensitivity" type="range" min="0" max="1" step="0.05">
          <output id="voiceSensitivityValue"></output>
        </label>

        <label>
          <span>Theme</span>
          <select id="theme" name="theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>

        <div class="actions">
          <button type="submit">Save settings</button>
          <span id="status" role="status"></span>
        </div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
